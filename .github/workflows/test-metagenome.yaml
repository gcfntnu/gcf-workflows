# This workflow will install snakemake==9.7.1 and test rule multiqc_report

name: Test metagenome

on: [push, pull_request]

jobs:
  bracken-database:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install focused regression dependencies
      run: python -m pip install 'snakemake==9.7.1' pandas
    - name: Check Bracken database paths and producer dependencies
      run: python -m unittest discover -s metagenome/.tests -p 'test_*.py' -v
    - name: Check reference root resolution
      run: python -m unittest discover -s gcfdb/.tests -p 'test_*.py' -v

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install snakemake==9.7.1 pyyaml==6.0 peppy rich pulp==2.7.0
        python --version
        python --version
    - name: Dry run multiqc_report
      working-directory: ./metagenome/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report
