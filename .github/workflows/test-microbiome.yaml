# This workflow will install snakemake==9.7.1 and test rule multiqc_report

name: Test microbiome

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install snakemake==9.7.1 pyyaml peppy rich pulp==2.7.0 -r .tests/requirements-config.txt
        python --version
        python --version
    - name: Dry run multiqc_report
      working-directory: ./microbiome/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report
