# This workflow will install snakemake==9.7.1 and test rule multiqc_report

name: Test default

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install snakemake==9.7.1 pyyaml==6.0 peppy rich pulp==2.7.0 pandas matplotlib -r .tests/requirements-config.txt
        python --version
    - name: Check MultiQC Git provenance and config generation
      run: python -m unittest discover -s misc/multiqc/.tests -p 'test_*.py' -v
    - name: Check test-all.sh failure propagation
      run: python -m unittest discover -s .tests -p 'test_*.py' -v
    - name: Dry run multiqc_report
      working-directory: ./default/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report
