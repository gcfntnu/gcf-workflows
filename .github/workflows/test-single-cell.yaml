# Check single-cell workflow construction and synthetic metadata contracts.

name: Test single-cell

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r singlecell/.tests/requirements.txt
        python --version
    - name: Dry run bfq_all
      working-directory: ./singlecell/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report
    - name: Metadata contracts and BFQ delivery
      run: python -m pytest -q singlecell/.tests/test_metadata.py singlecell/.tests/test_bfq_delivery.py singlecell/.tests/test_velocity.py singlecell/.tests/test_demultiplexing_profiles.py singlecell/.tests/test_tenx_reference.py
