# This workflow will install snakemake==9.7.1 and test rule multiqc_report

name: Test small-rna

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install snakemake==9.7.1 pyyaml==6.0 peppy rich pytest pulp==2.7.0 -r .tests/requirements-config.txt
        python --version
    - name: Prepare pinned fastp for synthetic regression
      run: |
        mkdir -p .dev/bin
        curl -fsSL https://opengene.org/fastp/fastp.0.20.1 -o .dev/bin/fastp
        echo "7860c80dea92c42ee0583544aa66057a7ce1ad1c37b99a22557bdb7f4c9497e3  .dev/bin/fastp" | sha256sum -c -
        chmod +x .dev/bin/fastp
    - name: Test small-RNA stages on synthetic reads
      run: FASTP_0201="$PWD/.dev/bin/fastp" python -m pytest -q smallrna/.tests/test_fastp.py
    - name: Test quant.method selection, route guards, UNITAS execution and miRge3 references
      run: python -m pytest -q smallrna/.tests/test_quant_methods.py smallrna/.tests/test_route_guards.py smallrna/.tests/test_run_unitas.py smallrna/.tests/test_bfq_unitas_links.py smallrna/.tests/test_unitas_tables.py smallrna/.tests/test_unitas_reference.py smallrna/.tests/test_mirge3_reference.py smallrna/.tests/test_mirge3_project_library.py
    - name: Dry run multiqc_report
      working-directory: ./smallrna/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report

  anndata-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install supported AnnData test dependencies
      run: python -m pip install pytest anndata==0.13.3.post0 numpy==2.5.2 pandas==3.0.5
    - name: Test AnnData creation and VSN layer assembly
      run: python -m pytest -q smallrna/.tests/test_create_anndata.py
