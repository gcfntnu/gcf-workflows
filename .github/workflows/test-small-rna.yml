# This workflow will install snakemake and test rule bfq_all

name: Test small-rna

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install snakemake==8.1.1 pyyaml==6.0 peppy rich pulp==2.7.0
        python --version
    - name: Dry run bfq_all
      working-directory: ./smallrna/.tests
      run: |
        snakemake -n -p --cores 1 multiqc_report

  anndata-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install supported AnnData test dependencies
      run: python -m pip install pytest anndata==0.13.3.post0 numpy==2.5.2 pandas==3.0.5
    - name: Test AnnData creation and VSN layer assembly
      run: python -m pytest -q smallrna/.tests/test_create_anndata.py
