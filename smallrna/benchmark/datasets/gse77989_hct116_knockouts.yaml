# GSE77989 (GEO; SRA PRJNA312310): HCT116 cells, parental and DROSHA, XPO5 and DICER knockouts (Kim et al., PNAS 113:E1881,
# 2016, doi:10.1073/pnas.1602532113). TruSeq Small RNA after gel selection of 17-30 nt, MiSeq, 65-nt reads, 2.9-4.5 M
# reads per library. Two sets of libraries: set 1 the parental cells (2 replicates) and the DROSHA knockout clone #40
# (2 replicates); set 2 the parental cells (1) and two clones each of the XPO5 and DICER knockouts.
# Canonical miRNAs need DROSHA and DICER, so their reads should nearly vanish in those knockouts: a negative control
# for miRNA counts (#452). Each knockout sample is compared with the parental cells of its set. XPO5 knockout lowers
# miRNAs only partly; it is reported, but the surviving miRNAs are listed for the DROSHA knockout.
# The study normalised the DROSHA and XPO5 knockouts to miR-320a-3p (made without DROSHA) and the DICER knockouts to
# rRNA and tRNA reads; the benchmark uses reads per million filtered reads. The study: canonical miRNAs are abolished
# without DROSHA, apart from a few made without it (Fig. 3B: the 5' capped miR-320a-3p, miR-320b-3p, miR-484, miR-7706-3p
# and miR-3615-3p, the mirtron miR-877-5p, and miR-1254-5p from an Alu element); without DICER many are still detected at
# reduced levels, from pre-miRNAs loaded onto AGO and trimmed at the 3' end, so 5p miRNAs.
name: gse77989_hct116_knockouts
kind: biological
organism: homo_sapiens
libprepkit: TruSeq Small RNA Library Prep Kit
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/gse77989   # relative to EXT_DIR
mirbase:                    # mature miRNAs of the release the methods use: names, accessions and truth groups
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
mirbase_releases:           # other releases a run can select: fill and prepare --mirbase-release (#431)
  '22':
    url: https://www.mirbase.org/download_version_files/22/mature.fa
    sha256: 3c521fc9bea3c7993e71cf188b11caf73e2d40ac83454e32876455317cc6d342
other_rna:                  # #415: miRBase entries inside molecules of other RNA classes are flagged; filled into <data>/other_rna/
  sources:
    refseq_rrna:            # 18S, 28S, 5.8S, 5S and the 45S pre-rRNA, whose spacers are taken outside the matures
      url: 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=NR_003286.4,NR_003287.4,NR_003285.3,NR_023363.1,NR_046235.3&rettype=fasta&retmode=text'
      sha256: 8ca32fdbf271f4337da04b4b5cbf551d3f163c48706af3724127637b4fe8ba63
    gtrnadb:                # mature tRNAs, introns removed; CCA is added
      url: https://gtrnadb.ucsc.edu/genomes/eukaryota/Hsapi38/hg38-mature-tRNAs.fa
      sha256: 1b4a5f3be176ca11debbc045ebeb0da12619005669877df428ab8fd533688adc
    ensembl_ncrna:          # Y RNA, snoRNA and scaRNA, snRNA, 7SK, 7SL, vault, mitochondrial tRNA and rRNA, 5S and 5.8S genes
      url: https://ftp.ensembl.org/pub/release-116/fasta/homo_sapiens/ncrna/Homo_sapiens.GRCh38.ncrna.fa.gz
      sha256: 7f03bb303e939517b322f7887a74c1ee15bbb82a6affbb54f0be84e82f89cff1
knockout:                   # #452: every other group against the parental cells of its set
  control: Parental
  survival: DROSHA KO       # the knockout whose surviving miRNAs are listed
  within: set
  expected: knockout_expected_hsa.tsv   # #478, made without DROSHA: the study's Fig. 3B and mirtronDB's mirtrons (knockout_expected.py)
samples:
  - sample: GSM2064270       # Parental cells (set 1) replicate 1
    group: Parental
    set: 1
    runs:
      - {run: SRR3174960, reads: 4217500, md5: 718835fa85a2b792d1fe2c790de48b38, url: https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR317/000/SRR3174960/SRR3174960.fastq.gz, content_md5: 04ea9d5fbfb7f77bfeca0b75f774f28c, sra: {md5: 36ae20fcff91b8d8dd7fe25da14abe2a, bytes: 139460776}}
  - sample: GSM2064271       # Parental cells (set 1) replicate 2
    group: Parental
    set: 1
    runs:
