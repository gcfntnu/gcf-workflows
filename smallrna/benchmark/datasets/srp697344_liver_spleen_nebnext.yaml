# SRA SRP697344: mouse liver and spleen total RNA mixed per mouse (Aparicio-Puerta et al., "An assessment of normalization and
# differential expression methods for miRNA-seq analysis using a realistic benchmark dataset", bioRxiv 2026,
# doi:10.64898/2026.05.08.723923; a preprint). Five mice, each at 0, 20, 40, 60, 80 and 100% spleen; one technical
# replicate per fraction with spleen (`replicate: 2`), and a pool of the five livers (subject `pool`, outside the series).
# NEBNext Multiplex Small RNA libraries, NovaSeq 6000, single end; 36 runs of 17-40M reads. The library names in SRA
# carry the design (`20_3S_80_3L`: 20% spleen and 80% liver of mouse 3; `_2`: the replicate); samples are named
# M<mouse>_S<percent spleen>. The authors note pancreas RNA in mouse 3 (high miR-7a) and kept it. No known composition
# (kind: mixture, #451): each mixture is predicted from its mouse's two pure samples.
name: srp697344_liver_spleen_nebnext
kind: mixture
organism: mus_musculus
libprepkit: NEBNext Multiplex Small RNA Library Prep Kit
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/srp697344   # relative to EXT_DIR
mirbase:                    # mature miRNAs of the release the methods use: names and accessions
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
mirbase_releases:           # other releases a run can select: fill and prepare --mirbase-release (#431)
  '22':
    url: https://www.mirbase.org/download_version_files/22/mature.fa
    sha256: 3c521fc9bea3c7993e71cf188b11caf73e2d40ac83454e32876455317cc6d342
mixture:
  components: [liver, spleen]   # `fraction` is the share of the second in the total RNA; 0 and 1 are the pure samples
de: {}                      # differential expression (#451): the pure tissues, and each pair of mixture fractions, paired by mouse
samples:
