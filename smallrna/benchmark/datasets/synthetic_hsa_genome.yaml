# Genome-wide synthetic human small-RNA reads of known origin (#412): about 500 miRNAs with their identical, near-identical
# and multi-locus relatives, isomiRs, sequencing errors with base qualities, and 6 + 6 samples whose counts follow a rank-2
# structure (the group contrast and a nuisance correlated with it), plus class-pure probe samples. `prepare` generates
# the reads from a fixed seed; `benchmark.py fill` downloads the miRBase files once into EXT_DIR/<data>.
name: synthetic_hsa_genome
kind: synthetic
organism: homo_sapiens
libprepkit: Bioo Scientific NEXTflex Small RNA-Seq Kit v4
adapter: TGGAATTCTCGGGTGCCAAGG
umi: 0                      # random nucleotides at each end of the insert (NEXTflex v3: 4)
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/synthetic_hsa
mirbase:                    # the release every method uses (#407)
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
  hairpin:                  # templated 3' and 5' extensions come from the hairpin
    url: https://www.mirbase.org/download_version_files/23.1/hairpin.fa
    sha256: 0b315c6071e84ee3bd8357c9696845f99b55842ec1cf8a83116fa01749467a5b
  gff:                      # loci: multi-locus matures, genomic clusters (co-regulation), annotated matures only
    url: https://www.mirbase.org/download_version_genome_files/23.1/hsa.gff3
    sha256: 45b2aa4f8306dc6b86831f652acb166567efe9e59c599d1b6f009f15d3424d07
mirbase_releases:           # other releases a run can select: fill and prepare --mirbase-release (#431)
  '22':
    url: https://www.mirbase.org/download_version_files/22/mature.fa
    sha256: 3c521fc9bea3c7993e71cf188b11caf73e2d40ac83454e32876455317cc6d342
    hairpin:
      url: https://www.mirbase.org/download_version_files/22/hairpin.fa
      sha256: 57419931ac0421c5dcbe871128b48d4b2ee1af219313f6183388be8da9b52517
    gff:
      url: https://www.mirbase.org/download_version_genome_files/22/hsa.gff3
      sha256: d02c0b4e9a401e66240418a572a10732b103dd64acfd10f59df171bcbbd40f59
de: {}                      # differential expression (#447): the ratiometric pools' tests (de.R) on the mixed samples, the
                            # group the designed fold changes raise against the other; also with the true nuisance scores
synthetic:
  mode: genome
  seed: 1
  mirnas: 500               # truth miRNAs, every pair one substitution apart and multi-locus matures included first
  abundance:                # expected reads per million of a mixed sample, by rank: Zipf, then a low tail
    zipf: 1.2               # top 10 about 60% of the miRNA reads, as in plasma (GSE317995)
    tail: {mirnas: 100, reads: [1, 50]}   # the last 100 ranks log-uniform between 1 and 50 reads per million
  near_identical: {ratio: 100, partner_absent: 0.33}   # pairs one substitution apart: 100:1 either way, a third alone
  reads: {mean: 1000000, cv: 0.3}          # reads per mixed sample (lognormal)
  groups: {control: 6, case: 6}
  dispersion: {asymptotic: 0.05, extra: 2}  # negative binomial: phi = 0.05 + 2 / expected count
  structure:
    group: {fraction: 0.15, log2: [-2, -1, -0.585, 0.585, 1, 2], include: [near_identical, multi_locus]}
    nuisance: {sd: 0.5, group_correlation: 0.3}
  coregulate: {distance: 10000, shared: 0.8}  # miRBase clusters (hairpins within 10 kb, same strand) share the nuisance
  isomirs:                  # shares of a miRNA's reads (mean over miRNAs; each miRNA draws its own around these)
    canonical: 0.8
    3p_trim_1: 0.06
    3p_trim_2: 0.02
    3p_templated_1: 0.04    # one more base of the hairpin
    3p_templated_2: 0.01
    3p_add_A: 0.03          # non-templated
    3p_add_U: 0.02
    5p_shift: 0.02          # +1 (trimmed) or -1 (one hairpin base added)
  errors: {rate: 0.001, first_base: 0.02}   # substitutions per base; NEXTflex v4 starts the insert at cycle 1
  qualities:                # binned NextSeq qualities: correct bases, and bases carrying an error
    correct: {37: 0.9, 23: 0.08, 12: 0.02}
    error: {12: 0.6, 2: 0.25, 23: 0.15}
  random_reads: {per_million: 100, length: [18, 26]}
  probes:                   # class-pure samples: a canonical carrier plus one read class of other miRNAs
    replicates: 2
    carrier: {mirnas: 30, reads: 1000}
    probe: {mirnas: 40, reads: 500}
  decoys:                   # reads of other RNA classes (#412 PR 2; decoys.py), from a stream of their own
    sources:                # filled into <data>/decoys/
      refseq_rrna:          # 18S, 28S, 5.8S, 5S and the 45S pre-rRNA, whose spacers are taken outside the matures
        url: 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=NR_003286.4,NR_003287.4,NR_003285.3,NR_023363.1,NR_046235.3&rettype=fasta&retmode=text'
        sha256: 8ca32fdbf271f4337da04b4b5cbf551d3f163c48706af3724127637b4fe8ba63
      gtrnadb:              # mature tRNAs, introns removed; CCA is added
        url: https://gtrnadb.ucsc.edu/genomes/eukaryota/Hsapi38/hg38-mature-tRNAs.fa
        sha256: 1b4a5f3be176ca11debbc045ebeb0da12619005669877df428ab8fd533688adc
      ensembl_ncrna:
        url: https://ftp.ensembl.org/pub/release-116/fasta/homo_sapiens/ncrna/Homo_sapiens.GRCh38.ncrna.fa.gz
        sha256: 7f03bb303e939517b322f7887a74c1ee15bbb82a6affbb54f0be84e82f89cff1
      ensembl_cdna:
        url: https://ftp.ensembl.org/pub/release-116/fasta/homo_sapiens/cdna/Homo_sapiens.GRCh38.cdna.all.fa.gz
        sha256: 683eb19310c40bf1396e4718f45afa2ce86755717c0990f47a171f535d248ea1
      pirnaclusterdb:       # the 927 human piRNA clusters UNITAS and TEsmall use
        url: https://www.pirnaclusterdb.org/data/FASTA/Homo_sapiens.piRNAclusters.fasta
        sha256: 2078dcb76ae76fd3249550dca5dbbce10da752dd8febd6854fa2a30d96026488
    load:                   # decoy reads per miRNA read in a mixed sample, by class and source (plasma-like)
      tRNA-gtrnadb: 0.15
      tRNA-ensembl: 0.02    # mitochondrial tRNAs
      rRNA-refseq: 0.08
      rRNA-ensembl: 0.02    # mitochondrial 12S/16S, 5S and 5.8S genes
      Y_RNA-ensembl: 0.05
      snoRNA-ensembl: 0.02
      other_ncRNA-ensembl: 0.02   # snRNA, 7SK, 7SL, vault RNA
      mRNA-ensembl: 0.03
      piRNA-pirnaclusterdb: 0.01
      precursor-mirbase: 0.01     # hairpin loops and flanks outside the matures
    nuisance: 0.5           # log2 change of the load per unit of the nuisance score: degraded samples carry more fragments
    fragments: 2000         # distinct fragments per class and source, lognormal weights (weight_sd 1.5)
    modification: 0.2       # tRNA fragments with a mismatch at m1G9 or m1A58
    probe: {reads: 5000}    # decoy reads of one class and source per probe sample (P_decoy_<class>-<source>_<replicate>)
