# GSE271895's LPS response (#414, #416): LPS against DMSO over the four siRNA arms, the arm (`sirna`) as a covariate, and per
# arm with `within: sirna` (the control arm's 3 against 3 among them). Base: gse271895_nextflex_v4.yaml, the same libraries
# and data folder, regrouped by drug; I2_LPS_C (55,677 reads) is left out. The arms respond alike: on the authors' count
# table (GEO supplementary file), edgeR finds a siRNA-by-LPS interaction for 2 of 790 miRNAs, and miR-146a-5p rises 2.8-4.3
# log2 with LPS in every arm (miR-155-5p 1.0-1.8). Pooled, LPS against DMSO calls 49 miRNAs at FDR 0.05 there, the control
# arm alone 5. No change is known, so the calls are reported, not scored.
extends: gse271895_nextflex_v4.yaml
name: gse271895_nextflex_v4_lps
de:                         # differential expression (#414): LPS against DMSO, the siRNA arm as a covariate
  contrast: [LPS, DMSO]
  covariates: [sirna]
  within: sirna
  'null': {splits: 50, seed: 1}   # quoted: a bare null key is YAML's null
samples:
  - sample: GSM8387787       # N_DMSO_A_VNS: Control siRNA DMSO treatment
    group: DMSO
    sirna: control
    drug: DMSO
    runs:
      - {run: SRR29759886, reads: 62641748, md5: 3b4c6903b06f3f5fa0352c4b04db54cb, url: https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR297/086/SRR29759886/SRR29759886.fastq.gz, sra: {md5: 011be30101dc2908019018a038745d7b, bytes: 1016793165}}
