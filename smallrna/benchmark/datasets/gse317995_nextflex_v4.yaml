# GSE317995 (GEO; SRA PRJNA1416291): human plasma, NEXTFLEX Small RNA-Seq Kit v4 with UDIs, NextSeq 500, 51-nt reads.
# 30 samples (adenomyosis, fertile and infertile controls); each is one library sequenced in the 4 lanes of one
# NextSeq run (flow cell HH2WHBGYW, run 262; lane from the read names), so its 4 runs are lane replicates.
# All 30 samples (#448), each group's in the order of its numbers; `prepare --per-group 2` takes the two lowest-numbered
# of each group, the quick run. No known composition (kind: biological).
name: gse317995_nextflex_v4
kind: biological
organism: homo_sapiens
libprepkit: Bioo Scientific NEXTflex Small RNA-Seq Kit v4
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/gse317995   # relative to EXT_DIR
config:
  # Inferred, not recorded in GEO: miR-486-5p and miR-451a are nearly absent, as with blood miRNA blockers (#361).
  blockers: [blood miRNA]
mirbase:                    # mature miRNAs of the release the methods use: names, accessions and truth groups
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
mirbase_releases:           # other releases a run can select: fill and prepare --mirbase-release (#431)
  '22':
    url: https://www.mirbase.org/download_version_files/22/mature.fa
    sha256: 3c521fc9bea3c7993e71cf188b11caf73e2d40ac83454e32876455317cc6d342
de:                         # null comparisons (#449): each group's samples split in two, so every call is false
  'null': {splits: 50, seed: 1}   # quoted: a bare null key is YAML's null
