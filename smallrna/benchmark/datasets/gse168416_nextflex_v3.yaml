# GSE168416 (GEO; SRA PRJNA707335): human colorectal cancer cell line DiFi, cells and extracellular fractions (small EVs
# sEV-P, exomeres, supermeres), 3 each (Zhang et al. 2021, PMID 34887515). Automated NEXTflex Small RNA-Seq Kit v3, NovaSeq 6000,
# 51-nt reads, 129-188M reads per library: the deep NEXTflex v3 set of the depth analysis (#409). The extracellular fractions
# are dominated by Y RNA, rRNA and tRNA fragments, the cells by miRNAs (other classes, #409). Reads as uploaded: raw, with the
# 3' adapter and the 4 random bases at each end. `prepare --per-group 1` takes one library per fraction.
name: gse168416_nextflex_v3
kind: biological
organism: homo_sapiens
libprepkit: Bioo Scientific NEXTflex Small RNA-Seq Kit v3
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/gse168416   # relative to EXT_DIR
mirbase:                    # mature miRNAs of the release the methods use: names, accessions and truth groups
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
