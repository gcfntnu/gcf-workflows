# GSE196633 (GEO; SRA PRJNA806640): human lung adenocarcinoma and adjacent normal tissue of 10 patients, paired. TruSeq
# Small RNA, HiSeq 2500, 51-nt reads, 65-98M reads per library: the deep TruSeq set of the depth analysis (#409) and real
# tissue with patient variance (#416). Reads as uploaded: raw, with the 3' adapter. `patient` pairs each tumour with its
# normal tissue; the DE step tests tumour against normal with the patient as a covariate (#447). Nothing is scored there:
# no change is known. The null comparisons (#449) split each group's ten patients in two, so every call is false. `prepare --per-group 3` takes the first three patients' tumours and normals (the issue's subset).
name: gse196633_truseq
kind: biological
organism: homo_sapiens
libprepkit: TruSeq Small RNA Library Prep Kit
methods: [unitas, mirge3, mirflowz, tesmall, tinyrna, smrnaseq, biocore_htseq, biocore_miraligner]
data: benchmark/smallrna/gse196633   # relative to EXT_DIR
mirbase:                    # mature miRNAs of the release the methods use: names, accessions and truth groups
  release: '23.1'
  url: https://www.mirbase.org/download_version_files/23.1/mature.fa
  sha256: 52d69eeb3c23c5ed0f66c8c9f24e1ad2cd94cc34e72e4fc376c0dd438d2779ff
mirbase_releases:           # other releases a run can select: fill and prepare --mirbase-release (#431)
  '22':
    url: https://www.mirbase.org/download_version_files/22/mature.fa
    sha256: 3c521fc9bea3c7993e71cf188b11caf73e2d40ac83454e32876455317cc6d342
de:                         # differential expression (#447): tumour against normal, paired by patient
  contrast: [tumour, normal]
  covariates: [patient]
  'null': {splits: 50, seed: 1}   # each group's patients split in two (#449); the patient pairs across groups, so it is left out
samples:
  - sample: GSM5897082       # B170406001GTV_T: Lung adenocarcinoma cells
    group: tumour
    patient: B170406001GTV
    runs:
      - {run: SRR18004549, reads: 69609400, md5: 76115a419af851ec1b8308c9f2e637df, url: https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR180/049/SRR18004549/SRR18004549.fastq.gz, sra: {md5: aae4734337fb26dfb4e3946c229598cf, bytes: 1593148628}}
